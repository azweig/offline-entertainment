name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, incl. security rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.8"
      - run: ruff check --output-format=github .

  test:
    name: Tests · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Real start-up (key 600 · 401 without key · 200 with key)
        run: ./scripts/smoke.sh python

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --strict

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner .

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t offline-entertainment:ci .
      - name: Container answers 401 without key and runs as a non-root user
        run: |
          docker run -d --name oe -p 127.0.0.1:8765:8765 --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 256 --memory 1g -v oe-config:/config offline-entertainment:ci
          for i in $(seq 1 40); do curl -s -o /dev/null http://127.0.0.1:8765/ && break; sleep 0.5; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/ping)" = "401"
          test "$(docker exec oe id -u)" = "10001"
          KEY=$(docker exec oe cat /config/key)
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "X-Key: $KEY" http://127.0.0.1:8765/api/ping)" = "200"
          echo "docker ok"
