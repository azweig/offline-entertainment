[project]
name = "offline-entertainment"
version = "1.3.0"
description = "Self-hosted server that saves videos and music to your phone for offline playback."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Alvaro Zweig" }]
dependencies = ["yt-dlp[default]>=2026.10.26"]
keywords = ["offline", "pwa", "self-hosted", "yt-dlp", "music-player", "privacy"]

[project.urls]
Homepage = "https://github.com/azweig/offline-entertainment"
Documentation = "https://github.com/azweig/offline-entertainment/tree/main/docs"
Issues = "https://github.com/azweig/offline-entertainment/issues"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# E/F: real errors · B: likely bugs · S: security (bandit rules) · UP: modern syntax
select = ["E", "F", "B", "S", "UP"]
ignore = [
  "E401",  # several imports on one line: project style (single-file server)
  "E701",
  "S104",  # binding to 0.0.0.0 only happens when the user asks for it with --host
  "S310",  # urlopen is only called with https URLs that already passed check_url()
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]
