<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline Entertainment</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1017">
<script src="i18n-dict.js"></script>
<script src="i18n.js"></script>
<script src="retro.js"></script>
<style>
  :root{--bg:#0b1017;--panel:#141d28;--line:#223041;--text:#eef2f6;--muted:#8799ab;
        --accent:#f2a33a;--ink:#1b1206;--err:#ef6b6b;--ok:#4cc38a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  .top{position:sticky;top:0;z-index:5;background:linear-gradient(#0b1017 70%,#0b101700);padding:12px 16px 14px}
  .bar{display:flex;gap:12px;align-items:center;max-width:1200px;margin:0 auto}
  .logo{display:flex;align-items:center;gap:8px;white-space:nowrap;line-height:1}
  .logo img{width:30px;height:30px;flex:none}
  .logo b{display:block;font-weight:800;font-size:17px;letter-spacing:-.02em}
  .logo small{display:block;margin-top:2px;font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .keybox .logo{justify-content:center;margin-bottom:4px}
  .keybox .ch{white-space:normal;text-align:center}
  .keybox .logo img{width:44px;height:44px}
  .keybox .logo b{font-size:22px}
  .keybox .logo small{font-size:11px}
  .search{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:10px 16px}
  .search:focus{outline:2px solid var(--accent)}
  .net{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
  .net.off{color:var(--accent);border-color:var(--accent)}
  nav{display:flex;gap:6px;overflow-x:auto;max-width:1200px;margin:10px auto 0;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{background:transparent;border:1px solid transparent;border-radius:99px;padding:6px 13px;color:var(--muted);white-space:nowrap}
  nav button.on{background:var(--text);color:var(--bg);font-weight:650}
  main{max-width:1200px;margin:0 auto;padding:4px 16px 320px}
  h2{font-size:17px;margin:22px 0 10px;letter-spacing:-.01em}
  .rowscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;scrollbar-width:none}
  .rowscroll::-webkit-scrollbar{display:none}
  .rowscroll .cardv{flex:0 0 46%;max-width:240px;scroll-snap-align:start}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 10px}
  .cardv{background:none;border:none;padding:0;text-align:left;display:block;width:100%}
  .th{position:relative;aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:linear-gradient(135deg,#1c2836,#101822);display:grid;place-items:center;color:var(--muted);font-size:24px}
  .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .th .dur{position:absolute;right:5px;bottom:5px;background:#000c;font-size:11px;padding:1px 5px;border-radius:4px;color:#fff}
  .th .badge{position:absolute;left:5px;top:5px;background:var(--accent);color:var(--ink);font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px}
  .cardv:active .th,.cardv:hover .th{outline:2px solid var(--accent)}
  .ti{font-size:13px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ch{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msg{color:var(--muted);padding:28px 8px;text-align:center}
  .meta{font-size:13px;color:var(--muted);margin-top:4px}
  .desc{font-size:13px;line-height:1.45;color:var(--text);opacity:.85;white-space:pre-wrap;overflow-wrap:anywhere;max-height:5.8em;overflow:hidden;margin-top:6px}
  .desc.open{max-height:40vh;overflow-y:auto}
  .more{background:none;border:none;padding:4px 0;color:var(--accent);font-size:13px}
  .mbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
  .tg{background:#223041;border:1px solid var(--line);border-radius:99px;padding:8px 12px;color:var(--muted);font-size:13px}
  .tg.on{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
  .mlist{display:grid;margin-top:6px}
  .mrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .mrow.now{background:#f2a33a1a;border-radius:8px}
  .mrow.now .ti{color:var(--accent);font-weight:650}
  .mrow img,.mrow .ph{width:56px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;background:var(--panel);flex:none;display:grid;place-items:center;color:var(--muted)}
  .mrow .mt{flex:1;min-width:0}
  .mrow .ti{margin:0;-webkit-line-clamp:1}
  .mn{width:22px;text-align:right;color:var(--muted);font-size:12px;flex:none}
  .mv{background:#223041;border:1px solid var(--line);border-radius:8px;width:36px;height:34px;color:var(--text);flex:none}
  .pc{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
  .pc .tg{padding:6px 10px}
  body.playing .queue{bottom:150px}
  .sorth{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .sorth select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
  .msg.err{color:var(--err)}
  .skel{flex:0 0 46%;max-width:240px;aspect-ratio:16/9;border-radius:9px;background:var(--panel);animation:p 1.2s infinite alternate}
  @keyframes p{to{opacity:.4}}
  .keybox{max-width:380px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px}
  .keybox input{background:#0b1017;border:1px solid var(--line);border-radius:10px;padding:12px}
  .btn{background:var(--accent);color:var(--ink);border:none;border-radius:10px;padding:12px 14px;font-weight:700}
  .btn.sec{background:#223041;color:var(--text)}
  .btn.danger{background:var(--err);color:#fff}
  .btn:disabled{opacity:.5}
  .scrim{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}
  .scrim.on{display:flex}
  .sheet{width:100%;max-width:520px;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px}
  .sheet .th{max-height:220px}
  .sheet h3{margin:0;font-size:16px}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .acts select{grid-column:1/-1;background:#0b1017;border:1px solid var(--line);border-radius:10px;padding:10px}
  .queue{position:fixed;left:12px;right:12px;bottom:12px;z-index:15;display:grid;gap:6px;max-width:520px;margin:0 auto;pointer-events:none}
  .q{background:#1b2735f5;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;pointer-events:auto}
  .q.err{border-color:var(--err)}
  .q .pb{height:4px;border-radius:4px;background:#0b1017;margin-top:6px;overflow:hidden}
  .q .pb i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .q .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .player{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#0b1017f5;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none}
  .player.on{display:block}
  .player .in{max-width:900px;margin:0 auto}
  .player video{width:100%;max-height:46vh;border-radius:10px;background:#000}
  .player audio{width:100%}
  .now{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-bottom:6px}
  .now span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .x{background:none;border:none;color:var(--muted);padding:0 4px}
  .lng{background:none;border:1px solid var(--line);border-radius:99px;color:var(--muted);padding:3px 7px;font-size:14px;flex:none}
  .wabtn{font-size:18px;padding:4px 10px;white-space:nowrap}
  .wabtn span{display:none;font-size:14px;font-weight:600;color:var(--text)}
  @media (min-width:900px){.wabtn span{display:inline}}
  @media (max-width:899px){.wabtn{display:none}}   /* en pantallas chicas abre el boton grande de abajo */
  .tools{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:13px}
  .del{position:absolute;right:5px;top:5px;background:#000b;border:none;border-radius:6px;color:#fff;font-size:12px;padding:3px 7px}
  @media (min-width:700px){.rowscroll .cardv,.skel{flex-basis:22%}.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
</style>
</head>
<body>
<div class="top" id="top" hidden>
  <div class="bar">
    <div class="logo"><img src="icon.svg" alt=""><div><b>Offline</b><small>Entertainment</small></div></div>
    <input class="search" id="q" type="search" placeholder="Buscar o pegar un enlace (YouTube, Spotify, TikTok…)" enterkeyhint="search" autocomplete="off">
    <span class="net" id="net">en línea</span>
    <button class="lng wabtn" data-retro aria-label="Escuchar música">📼<span> Escuchar música</span></button>
    <button class="lng" data-lang-pick aria-label="Idioma">🌐</button>
  </div>
  <nav id="nav"></nav>
</div>
<main id="main"></main>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="queue" id="queue"></div>
<div class="player" id="player"><div class="in"><div class="now"><span id="now"></span><button class="x" id="close" aria-label="Cerrar reproductor">✕</button></div><div id="slot"></div>
  <div class="pc" id="pctl" hidden><button class="tg" id="pprev" aria-label="Anterior">⏮ Anterior</button><button class="tg" id="pnext" aria-label="Siguiente">Siguiente ⏭</button><button class="tg" id="pshuf">🔀 Aleatorio</button><button class="tg" id="prep">🔁 Repetir</button></div></div></div>

<script>
const $ = s => document.querySelector(s);
// miniatura que no carga: se quita (sin onerror en el HTML, la CSP no permite manejadores en linea)
document.addEventListener('error', e => { if (e.target.tagName === 'IMG' && e.target.closest('.th')) e.target.remove(); }, true);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mb = b => b > 1e9 ? (b/1e9).toFixed(1)+' GB' : Math.max(1, Math.round(b/1e6))+' MB';
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const ago = ts => { if (!ts) return ''; const d = (Date.now()/1000 - ts) / 86400;
  if (d < 1) return 'hoy'; if (d < 2) return 'ayer'; if (d < 7) return `hace ${Math.floor(d)} días`;
  if (d < 30) { const n = Math.floor(d/7); return `hace ${n} semana${n > 1 ? 's' : ''}`; }
  if (d < 360) { const n = Math.max(1, Math.floor(d/30)); return `hace ${n} mes${n > 1 ? 'es' : ''}`; }
  const n = Math.max(1, Math.floor(d/365)); return `hace ${n} año${n > 1 ? 's' : ''}`; };
// fecha en el formato del idioma elegido (22 sep 2007 · Sep 22, 2007 · 2007年9月22日 ...)
const fecha = ymd => { if (!ymd) return ''; const d = new Date(Date.UTC(+ymd.slice(0,4), +ymd.slice(4,6)-1, +ymd.slice(6,8)));
  try { return d.toLocaleDateString(document.documentElement.lang || 'es', {day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC'}); }
  catch { return `${+ymd.slice(6,8)} ${MESES[+ymd.slice(4,6)-1]} ${ymd.slice(0,4)}`; } };
const vistas = n => n == null ? '' : n >= 1e6 ? `${(n/1e6).toFixed(1).replace('.0','').replace('.',',')} M de vistas` : n >= 1e3 ? `${Math.round(n/1e3)} mil vistas` : `${n} vistas`;
let order = '', searchTok = 0, stype = 'videos', lastQ = '';   // pestaña del buscador: videos | playlists   // '' relevancia | 'new' mas nuevos | 'old' mas antiguos
const dur = s => { if (!s) return ''; s = Math.round(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = String(s%60).padStart(2,'0'); return h ? `${h}:${String(m).padStart(2,'0')}:${x}` : `${m}:${x}`; };
const kindOf = n => /\.(mp3|m4a|opus|ogg)$/i.test(n) ? 'audio' : 'video';
const titleOf = n => n.replace(/\.[^.]+$/, '').replace(/\s*\[[^\]]+\]$/, '').replace(/\s*\{[^}]+\}$/, '');
const MIME = {mp3:'audio/mpeg', m4a:'audio/mp4', opus:'audio/ogg', ogg:'audio/ogg', mp4:'video/mp4', webm:'video/webm', mkv:'video/x-matroska', thumb:'image/jpeg'};
const SECTIONS = [
  // q: lo que se busca en YouTube, en el idioma elegido
  {k:'musica',   t:'Música',    q:(window.t || String)('música'),    mode:'audio'},
  {k:'noticias', t:'Noticias',  q:(window.t || String)('noticias de hoy'), mode:'video'},
  {k:'series',   t:'Series',    q:(window.t || String)('series'),    mode:'video'},
  {k:'peliculas',t:'Películas', q:(window.t || String)('películas'), mode:'video'},
];
let online = false;  // conexion REAL con el servidor (navigator.onLine solo dice si hay wifi/datos)
// clave por enlace (http://.../#k=CLAVE): el fragmento no llega al servidor; se guarda y se borra de la barra
(() => { const k = new URLSearchParams(location.hash.slice(1)).get('k');
  if (k){ try { localStorage.setItem('vk', k); } catch {} history.replaceState(null, '', location.pathname + location.search); } })();
let key = localStorage.getItem('vk') || '', view = 'inicio', library = [], current = null, objUrl = null, thumbUrls = {}, libFilter = 'all';
const cache = new Map();

// ---------- almacenamiento en el dispositivo (OPFS; IndexedDB de respaldo)
const store = {
  async init(){
    try {
      this.root = await navigator.storage.getDirectory();
      const t = await this.root.getFileHandle('.probe', {create:true});
      if (!t.createWritable) throw new Error('sin createWritable');
      await this.root.removeEntry('.probe'); this.mode = 'opfs';
    } catch {
      this.mode = 'idb';
      this.db = await new Promise((ok, no) => { const r = indexedDB.open('offline-entertainment', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('files', {keyPath:'name'});
        r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
    }
    if (navigator.storage?.persist) navigator.storage.persist();
  },
  // Safari a veces no deja guardar un Blob en IndexedDB (p. ej. navegacion privada): entonces se guardan los bytes
  async idbPut(name, blob){
    try { await this.tx('readwrite', s => s.put({name, size: blob.size, mtime: Date.now(), blob})); }
    catch { const buf = await blob.arrayBuffer(); await this.tx('readwrite', s => s.put({name, size: blob.size, mtime: Date.now(), blob: buf, type: blob.type})); }
  },
  tx(mode, fn){ return new Promise((ok, no) => { const t = this.db.transaction('files', mode); const r = fn(t.objectStore('files')); t.oncomplete = () => ok(r.result); t.onerror = t.onabort = () => no(t.error || new Error('No se pudo guardar')); }); },
  async save(name, response, onProgress = () => {}){
    const reader = response.body.getReader(), total = +response.headers.get('Content-Length') || 0; let done = 0;
    if (this.mode === 'opfs'){
      const h = await this.root.getFileHandle(name, {create:true}), w = await h.createWritable();
      try { for(;;){ const {value, done: end} = await reader.read(); if (end) break; await w.write(value); done += value.length; onProgress(total ? done*100/total : 0); }
        await w.close(); if (total && done !== total) throw new Error('Transferencia incompleta');
      } catch (e) { try { await w.abort(); } catch {} try { await this.root.removeEntry(name); } catch {} throw e; }
    } else {
      const parts = [];
      for(;;){ const {value, done: end} = await reader.read(); if (end) break; parts.push(value); done += value.length; onProgress(total ? done*100/total : 0); }
      if (total && done !== total) throw new Error('Transferencia incompleta');
      const blob = new Blob(parts, {type: MIME[name.split('.').pop().toLowerCase()] || ''});
      await this.idbPut(name, blob);
    }
  },
  async list(){
    const out = [];
    if (this.mode === 'opfs'){
      for await (const [name, h] of this.root.entries()){
        if (h.kind !== 'file' || name.startsWith('.') || name.endsWith('.crswap')) continue;
        const f = await h.getFile(); out.push({name, size: f.size, mtime: f.lastModified});
      }
    } else for (const r of await this.tx('readonly', s => s.getAll())) if (!r.name.startsWith('.')) out.push({name: r.name, size: r.size, mtime: r.mtime});
    return out.sort((a, b) => b.mtime - a.mtime);
  },
  async blob(name){
    if (this.mode === 'opfs'){
      const f = await (await this.root.getFileHandle(name)).getFile();
      return f.type ? f : new File([f], name, {type: MIME[name.split('.').pop().toLowerCase()] || ''});
    }
    const r = await this.tx('readonly', s => s.get(name)); if (!r) throw new Error('No está en este dispositivo');
    return r.blob instanceof Blob ? r.blob : new Blob([r.blob], {type: r.type || MIME[name.split('.').pop().toLowerCase()] || ''});
  },
  async remove(name){ try { if (this.mode === 'opfs') await this.root.removeEntry(name); else await this.tx('readwrite', s => s.delete(name)); } catch {} },
  // ---- descargas que se pueden retomar: lo recibido se guarda en trozos de 8 MB ya confirmados
  // (".part-<trabajo>-<n>"). Si el celular congela la app, al volver se pide solo lo que falta.
  async names(){
    if (this.mode === 'opfs'){ const o = []; for await (const [n, h] of this.root.entries()) if (h.kind === 'file') o.push(n); return o; }
    return (await this.tx('readonly', s => s.getAllKeys())) || [];
  },
  async parts(job){
    const pre = `.part-${job}-`, out = [];
    for (const n of await this.names()) if (n.startsWith(pre)) out.push(n);
    out.sort((a, b) => +a.slice(pre.length) - +b.slice(pre.length));
    let size = 0; for (const n of out) size += (await this.blob(n)).size;
    return {names: out, size};
  },
  async putBlob(name, blob){
    if (this.mode === 'opfs'){ const w = await (await this.root.getFileHandle(name, {create: true})).createWritable(); await w.write(blob); await w.close(); }
    else await this.idbPut(name, blob);
  },
  async dropParts(job){ for (const n of await this.names()) if (n.startsWith(job ? `.part-${job}-` : '.part-')) await this.remove(n); },
  async receive(job, name, response, offset, total, onProgress){
    const reader = response.body.getReader();
    let {names} = await this.parts(job), idx = names.length, buf = [], bufLen = 0, done = offset;
    const flush = async () => { if (!bufLen) return; await this.putBlob(`.part-${job}-${idx++}`, new Blob(buf)); buf = []; bufLen = 0; };
    try {
      for(;;){ const {value, done: end} = await reader.read(); if (end) break;
        buf.push(value); bufLen += value.length; done += value.length; onProgress(total ? done * 100 / total : 0);
        if (bufLen >= 8e6) await flush(); }
    } finally { await flush().catch(() => {}); }        // aunque se corte, lo recibido queda confirmado
    if (total && done !== total) throw new Error('Transferencia incompleta');
    const p = await this.parts(job);
    if (total && p.size !== total) throw new Error('Transferencia incompleta');
    const type = MIME[name.split('.').pop().toLowerCase()] || '';
    if (this.mode === 'opfs'){
      const w = await (await this.root.getFileHandle(name, {create: true})).createWritable();
      try { for (const n of p.names) await w.write(await this.blob(n)); await w.close(); }
      catch (e) { try { await w.abort(); } catch {} throw e; }
    } else {
      const blobs = []; for (const n of p.names) blobs.push(await this.blob(n));
      await this.putBlob(name, new Blob(blobs, {type}));
    }
    await this.dropParts(job);
  },
};

// ---------- servidor
function ytLink(s){
  try {
    const u = new URL(s), h = u.hostname.toLowerCase().replace(/^(www|m|music)\./, ''), p = u.pathname.split('/').filter(Boolean);
    if (h !== 'youtube.com' && h !== 'youtu.be' && h !== 'youtube-nocookie.com') return null;
    const list = u.searchParams.get('list') || '', okList = /^[\w-]{12,80}$/.test(list);
    if (h === 'youtube.com' && p[0] === 'playlist') return okList ? {type: 'playlist', id: list} : null;
    if (h === 'youtube.com' && p[0] && p[0].startsWith('@')) return {type: 'artist', id: decodeURIComponent(p[0])};
    if (h === 'youtube.com' && p[0] === 'channel' && /^UC[\w-]{22}$/.test(p[1] || '')) return {type: 'artist', id: p[1]};
    const id = ytId(s); if (id) return {type: 'video', id, list: okList ? list : ''};
    return null;
  } catch { return null; }
}
function ytId(s){
  try {
    const u = new URL(s), h = u.hostname.toLowerCase().replace(/^(www|m|music)\./, ''), p = u.pathname.split('/').filter(Boolean);
    let id = '';
    if (h === 'youtu.be') id = p[0] || '';
    else if (h === 'youtube.com' || h === 'youtube-nocookie.com') id = p[0] === 'watch' ? (u.searchParams.get('v') || '') : (['shorts','live','embed','v'].includes(p[0]) ? p[1] || '' : '');
    return /^[\w-]{11}$/.test(id) ? id : '';
  } catch { return ''; }
}
async function api(path, opts = {}){
  let r;
  try { r = await fetch(path, {...opts, headers: {'X-Key': key, ...(opts.headers || {})}}); }
  catch (e) { setOnline(false); throw new Error('Sin conexión'); }
  if (r.status === 401){ key = ''; localStorage.removeItem('vk'); showKey('Clave incorrecta'); throw new Error('Clave incorrecta'); }
  return r;
}
async function search(q, n = 12, sort = ''){
  const id = n + '|' + sort + '|' + q; if (cache.has(id)) return cache.get(id);
  const r = await api(`api/search?n=${n}&sort=${sort}&q=${encodeURIComponent(q)}`), j = await r.json();
  if (!r.ok) throw new Error(j.error || 'No se pudo buscar');
  cache.set(id, j); return j;
}

async function forYou(){
  const box = $('#parati'); if (!box) return;
  const seeds = []; const seen = new Set();
  for (const f of library){ const id = idOf(f.name); if (id && !seen.has(id)){ seen.add(id); seeds.push({id, title: f.title, mode: f.kind}); } if (seeds.length >= 6) break; }
  if (!seeds.length) return;
  const used = new Set(library.map(f => idOf(f.name)));            // nunca sugerir lo ya guardado
  const take = (list, n = 12) => list.filter(x => !used.has(x.id) && (used.add(x.id), true)).slice(0, n);
  const row = (id, title) => { const d = document.createElement('div');
    d.innerHTML = `<h2>${esc(title)}</h2><div class="rowscroll" id="${id}">${'<div class="skel"></div>'.repeat(4)}</div>`; box.append(d); return d; };
  const fill = (d, list, mode) => { if (!$('#parati')) return; if (!list.length) return d.remove();
    d.querySelector('.rowscroll').innerHTML = remember(list).map(x => card(x, mode)).join(''); };
  const short = t => t.length > 42 ? t.slice(0, 40) + '…' : t;
  // filas en orden fijo, se llenan a medida que llegan
  const rows = seeds.slice(0, 3).map((sd, i) => row('pt-' + i, `Porque guardaste «${short(sd.title)}»`));
  const results = await Promise.all(seeds.map(sd => getJSON('api/related?id=' + sd.id).catch(() => ({seed: null, items: []}))));
  if (view !== 'inicio' || !$('#parati')) return;
  for (let i = 0; i < rows.length; i++){
    let list = results[i].items;
    if (!list.length) try { list = await search(seeds[i].title, 12); } catch { list = []; }
    fill(rows[i], take(list), seeds[i].mode);
  }
  // canales que mas aparecen entre tus descargas recientes
  const count = {};
  results.forEach((r, i) => { const s = r.seed; if (s && s.channel_id){ const c = count[s.channel_id] ||= {n: 0, name: s.channel, mode: seeds[i].mode}; c.n++; } });
  const chans = Object.entries(count).sort((a, b) => b[1].n - a[1].n).slice(0, 2);
  for (const [cid, c] of chans){
    const d = row('pc-' + cid, `Más de ${c.name}`);
    getJSON('api/channel?id=' + cid).then(list => fill(d, take(list), c.mode)).catch(() => d.remove());
  }
  // lo que sobra de las mixes de las otras descargas recientes
  const rest = take(results.slice(3).flatMap(r => r.items), 12);
  if (rest.length) fill(row('pt-mas', 'Más relacionado con tus descargas'), rest, 'video');
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
const visible = () => new Promise(ok => { if (!document.hidden) return ok();
  const f = () => { if (!document.hidden){ document.removeEventListener('visibilitychange', f); ok(); } }; document.addEventListener('visibilitychange', f); });
// Pide al servidor que prepare (o reusa lo que ya preparo: st.job sobrevive aunque cierres la app)
async function startJob(v, mode, quality, st, save = () => {}){
  if (st.job){
    const r = await api('api/jobs/' + st.job);
    if (r.ok) return r.json();
    await store.dropParts(st.job); st.job = null; save();        // vencio en el servidor: se empieza de nuevo
  }
  const r = await api('api/jobs', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(v.sp && !v.id && !v.url ? {song: {title: v.title, artists: v.artists || ''}, mode, quality} : {id: v.id, url: v.url, mode, quality})});
  const j = await r.json(); if (!r.ok){ const e = new Error(j.error); e.retry = j.retry; throw e; }
  st.job = j.id; save(); return j;
}
async function downloadOne(v, mode, quality, set, st = {}, save = () => {}){
  let j = await startJob(v, mode, quality, st, save), r;
  while (!['listo','error'].includes(j.status)){
    await sleep(1000);
    r = await api('api/jobs/' + j.id); j = await r.json(); if (!r.ok){ st.job = null; save(); throw new Error(j.error); }
    set(j.status === 'descargando' ? `Preparando… ${j.progress}%` : 'Preparando…', j.progress / 2);
  }
  if (j.status === 'error'){ st.job = null; save(); throw new Error(j.error); }
  // traer el archivo; si se corta (saliste de la app, se fue la señal) se retoma donde quedo
  for (let tries = 0; ; tries++){
    const have = (await store.parts(j.id)).size;
    try {
      r = await api(`api/jobs/${j.id}/file`, have ? {headers: {Range: `bytes=${have}-`}} : {});
      if (r.status === 409 && tries < 20){ set('Retomando…'); await sleep(4000); continue; }   // la conexion vieja aun no se cerro
      if (r.status === 416 && have){ await store.dropParts(j.id); continue; }   // lo guardado no cuadra: de cero
      if (!r.ok) throw Object.assign(new Error((await r.json().catch(() => ({}))).error || 'No disponible'), {fatal: true});
      const offset = r.status === 206 ? have : 0;
      if (!offset && have) await store.dropParts(j.id);
      await store.receive(j.id, j.filename, r, offset, j.size, p => set(`Guardando… ${Math.round(p)}%`, 50 + p / 2));
      break;
    } catch (e) {
      if (e.fatal || tries >= 30){ await store.dropParts(j.id); st.job = null; save(); throw e; }
      set(document.hidden ? 'En pausa: vuelve a la app para seguir' : 'Se cortó, retomando…');
      await visible(); await sleep(1500);
    }
  }
  st.job = null; save();
  const tid = v.id || (v.sp ? idOf(j.filename) : '');   // cancion de Spotify: la miniatura del video que se encontro
  if (tid) try { const t = await api('api/thumb?id=' + encodeURIComponent(tid)); if (t.ok) await store.save(j.filename + '.thumb', t); } catch {}
  else if ((v.thumb || '').startsWith('data:image/')) try { await store.save(j.filename + '.thumb', await fetch(v.thumb)); } catch {}
  await refresh(); return j;
}

let chain = Promise.resolve();
function enqueue(v, mode, quality){
  const el = document.createElement('div'); el.className = 'q';
  el.innerHTML = `<div class="t">${esc(v.title)}</div><div class="ch">En cola…</div><div class="pb"><i style="width:0"></i></div>`;

  const set = (txt, pct) => { el.children[1].textContent = txt; if (pct != null) el.querySelector('i').style.width = pct + '%'; };
  busy++; keepAwake();
  chain = chain.then(async () => {
    try {
      await downloadOne(v, mode, quality, set);
      set('Guardado. Ya puedes verlo sin conexión.', 100); el.querySelector('i').style.background = 'var(--ok)';
      setTimeout(() => el.remove(), 3500);
    } catch (err) { el.classList.add('err'); set('No se pudo: ' + err.message); el.onclick = () => el.remove(); setTimeout(() => el.remove(), 15000); }
    finally { busy--; keepAwake(); }

}

  $('#sheet').innerHTML = `<div><h3>¿Quitar la playlist «${esc(title)}»?</h3>
    <div class="meta">Las canciones no se borran: siguen en Mis descargas → Música.</div></div>
    <div class="acts"><button class="btn sec" data-r="no">Cancelar</button><button class="btn danger" data-r="si">Quitar playlist</button></div>`;
  $('#sheet').onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return;
    if (b.dataset.r === 'si'){ const all = pls(); delete all[key]; LSset('vpls', all); libFilter = 'audio'; sorting = false; renderLibrary(); }
    $('#scrim').classList.remove('on'); };
  $('#scrim').classList.add('on');
}
// borrar un archivo pide confirmacion: no se puede deshacer
function confirmRemoveItem(name){
  $('#sheet').innerHTML = `<div><h3>¿Borrar «${esc(titleOf(name))}»?</h3>
    <div class="meta">Se borra de este celular. Para tenerlo de nuevo hay que volver a descargarlo con internet.</div></div>
    <div class="acts"><button class="btn sec" data-r="no">Cancelar</button><button class="btn danger" data-r="si">Borrar</button></div>`;
  $('#sheet').onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return;
    $('#scrim').classList.remove('on'); if (b.dataset.r === 'si') removeItem(name); };
  $('#scrim').classList.add('on');
}
async function removeItem(name){
  if (current === name) closePlayer();
  await store.remove(name); await store.remove(name + '.thumb');
  if (thumbUrls[name]){ URL.revokeObjectURL(thumbUrls[name]); delete thumbUrls[name]; }
  refresh();
}

// ---------- reproductor
async function play(name){
  const item = library.find(i => i.name === name); if (!item) return;
  if (item.kind === 'audio'){ const sc = scopeOf(libFilter), k = queue.indexOf(name);
    if (k < 0 || queueScope !== sc) buildQueue(name, sc); else qi = k; playErr = 0; return playAudio(name); }
  queue = []; qi = -1;
  if (objUrl) URL.revokeObjectURL(objUrl);
  objUrl = URL.createObjectURL(await store.blob(name)); current = name;
  $('#slot').innerHTML = `<video controls autoplay playsinline src="${objUrl}"></video>`;   // los videos no avanzan solos
  $('#now').textContent = item.title; $('#pctl').hidden = true; $('#player').classList.add('on'); document.body.classList.add('playing');
  if ('mediaSession' in navigator){ navigator.mediaSession.metadata = new MediaMetadata({title: item.title, artist: 'Offline Entertainment', artwork: thumbUrls[name] ? [{src: thumbUrls[name]}] : []});
    navigator.mediaSession.setActionHandler('nexttrack', null); navigator.mediaSession.setActionHandler('previoustrack', null); }
}
async function playAudio(name){
  const item = library.find(i => i.name === name);
  if (!item){ queue = queue.filter(n => n !== name); if (queue.length){ qi = Math.min(qi, queue.length - 1); return playAudio(queue[qi]); } return; }
  let url; try { url = URL.createObjectURL(await store.blob(name)); } catch { return skipBroken(); }
  let a = $('#slot audio');   // un solo <audio>: asi sigue sonando con la pantalla bloqueada
  if (!a){ $('#slot').innerHTML = '<audio controls playsinline></audio>'; a = $('#slot audio');
    a.onended = () => step(1); a.onerror = () => { if (a.getAttribute('src')) skipBroken(); }; a.onplaying = () => { playErr = 0; }; }
  a.src = url; a.play().catch(() => {});
  if (objUrl) URL.revokeObjectURL(objUrl); objUrl = url; current = name;
  $('#now').textContent = item.title; $('#pctl').hidden = false; ctl();
  $('#player').classList.add('on'); document.body.classList.add('playing');
  if ('mediaSession' in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({title: item.title, artist: 'Offline Entertainment', artwork: thumbUrls[name] ? [{src: thumbUrls[name]}] : []});
    navigator.mediaSession.setActionHandler('nexttrack', () => step(1));
    navigator.mediaSession.setActionHandler('previoustrack', () => step(-1));
  }
  if (view === 'descargas' && libFilter !== 'all' && libFilter !== 'video') renderLibrary();
}
function closePlayer(){ current = null; queue = []; qi = -1; $('#slot').innerHTML = ''; $('#player').classList.remove('on'); document.body.classList.remove('playing'); if (objUrl) URL.revokeObjectURL(objUrl); objUrl = null; }
$('#close').onclick = closePlayer;

// ---------- arranque y conexion
// ---------- conexion: sin internet solo se abre "Mis descargas"
async function ping(ms = 2500){
  if (!navigator.onLine) return 'off';
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch('api/ping', {headers: {'X-Key': key}, cache: 'no-store', signal: c.signal});
        return r.status === 401 ? 'key' : r.ok ? 'on' : 'off'; }
  catch { return 'off'; } finally { clearTimeout(t); }
}
function setOnline(v){
  if (v === online) return;
  online = v;
  $('#net').textContent = v ? 'en línea' : 'sin conexión'; $('#net').classList.toggle('off', !v);
  $('#q').hidden = !v;
  if (!$('#top').hidden){ if (!v && view !== 'descargas') go('descargas'); else nav(); }
  if (v) runBatch();
}
async function recheck(){ const s = await ping(); if (s === 'key') return showKey(); setOnline(s === 'on'); }
function start(){
  // trozos de descargas que ya no estan en la cola (p. ej. una suelta que se corto y cerraste la app)
  const keep = new Set((batch?.items || []).map(x => x.job).filter(Boolean));
  store.names().then(ns => { for (const n of ns){ const m = n.match(/^\.part-([0-9a-f]{16})-/); if (m && !keep.has(m[1])) store.remove(n); } }).catch(() => {});
  $('#top').hidden = false;
  $('#net').textContent = online ? 'en línea' : 'sin conexión'; $('#net').classList.toggle('off', !online); $('#q').hidden = !online;
  go(online ? 'inicio' : 'descargas');
  runBatch();
}
addEventListener('offline', () => setOnline(false));
addEventListener('online', recheck);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#top').hidden) recheck(); });
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(() => {});
  // hay una version nueva de la app: se recarga sola (si no esta descargando ni sonando nada)
  const had = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!had || reloaded || busy || batchRunning || current) return; reloaded = true; location.reload(); });
}
// invitacion con musica en el enlace: se saca de la barra y, si hace falta la clave, espera a que entres
if (location.hash.includes('#inv=')){ try { sessionStorage.setItem('vinv', location.hash); } catch {} history.replaceState(null, '', location.pathname + location.search); }
const pendingInv = () => { let h = ''; try { h = sessionStorage.getItem('vinv') || ''; sessionStorage.removeItem('vinv'); } catch {} if (h) takeInv(h); };
addEventListener('hashchange', () => { if (location.hash.includes('#inv=')){ const h = location.hash; history.replaceState(null, '', location.pathname + location.search); takeInv(h); } });
store.init().then(refresh).then(async () => {
  const s = await ping();          // como mucho 2,5 s; sin red, al instante
  if (s === 'key') return showKey();
  online = s === 'on';
  start();
  pendingInv();
});
</script>
